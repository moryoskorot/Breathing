<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
body { min-height: 100dvh; overflow-y: auto; }
.main { width: 100%; display: flex; justify-content: center; }
.toolbar {
  width: 100%;
  padding: 12px 28px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--tb-bg);
  border-top: 1px solid var(--tb-border);
  flex-shrink: 0;
  position: sticky;
  bottom: 0;
  z-index: 10;
}
</style>
</head>
<body class="theme-dark">

<div class="sky-layer">
  <svg viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#4d8fe8"/>
        <stop offset="100%" stop-color="#7fb5fa"/>
      </linearGradient>
    </defs>
    <path fill="url(#skyGrad)" d="M0,0 L1440,0 L1440,260
      C1360,235 1280,272 1160,248
      C1040,224 940,268 800,245
      C660,222 560,262 400,238
      C280,220 160,255 0,235 Z"/>
  </svg>
</div>

<main class="main">
  <div class="exercise-grid">

    <div class="tier-section">
      <div class="tier-label">Foundations</div>
      <a class="exercise-btn" href="./box/">Box Breathing</a>
      <a class="exercise-btn" href="./coherent/">Coherent Breathing</a>
      <a class="exercise-btn" href="./478/">4-7-8 Breathing</a>
      <a class="exercise-btn" href="./diaphragmatic/">Diaphragmatic</a>
      <a class="exercise-btn" href="./sigh/">Physiological Sigh</a>
      <a class="exercise-btn" href="./nadi/">Nadi Shodhana</a>
    </div>

    <div class="tier-section">
      <div class="tier-label">Yoga · Pranayama</div>
      <a class="exercise-btn" href="./ujjayi/">Ujjayi</a>
      <a class="exercise-btn" href="./bhramari/">Bhramari</a>
      <a class="exercise-btn" href="./lions/">Lion's Breath</a>
      <a class="exercise-btn" href="./sitali/">Sitali</a>
    </div>

    <div class="tier-section">
      <div class="tier-label">Advanced</div>
      <a class="exercise-btn advanced" href="./wimhof/">Wim Hof</a>
      <a class="exercise-btn advanced" href="./kapalabhati/">Kapalabhati</a>
      <a class="exercise-btn advanced" href="./bhastrika/">Bhastrika</a>
    </div>

  </div>
</main>

<div class="toolbar">
  <div class="theme-group">
    <button class="theme-btn" data-theme="sand"  title="Sand"  style="background:#FFEBCD; border-color:#c4b48a;"></button>
    <button class="theme-btn" data-theme="light" title="Light" style="background:#ffffff; border-color:#cccccc;"></button>
    <button class="theme-btn" data-theme="dark"  title="Dark"  style="background:#090e1a; border-color:#2a3a5e;"></button>
  </div>
</div>

<div class="footer">
  <span>Made by <a href="https://www.linkedin.com/in/mor-yosef-185331196/" target="_blank" rel="noopener">Mor Yosef</a></span>
</div>

<script>
const THEME_KEY = 'breathingTheme';
let currentTheme = localStorage.getItem(THEME_KEY) || 'dark';
document.body.className = 'theme-' + currentTheme;
document.querySelectorAll('.theme-btn').forEach(b =>
  b.classList.toggle('active', b.dataset.theme === currentTheme));
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTheme = btn.dataset.theme;
    document.body.className = 'theme-' + currentTheme;
    localStorage.setItem(THEME_KEY, currentTheme);
    document.querySelectorAll('.theme-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === currentTheme));
  });
});
</script>
</body>
</html>
