<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujjayi</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Ujjayi',
  mode: 'free',
  phases: [
    { label: 'Inhale', fn: s=>s,       audio: 'nasal-in',  scale: 'inhale', via: 'throat' },
    { label: 'Exhale', fn: s=>s*1.5,   audio: 'nasal-out', scale: 'exhale', via: 'throat' },
  ],
  controls: { lengths: [4, 5, 6], defaultLength: 4 },
  about: {
    description: 'Ocean breath — slow nasal breathing with a gentle constriction of the glottis, producing a soft oceanic sound on both inhale and exhale. The signature breath of Ashtanga and Vinyasa yoga. Constrict gently as if fogging a mirror with the mouth closed.',
    benefits: [
      'Slows respiratory rate to 5–6 breaths/min',
      'Builds internal heat and deepens focus',
      'Lowers cortisol and improves emotional regulation',
      'Synchronises movement and breath in yoga practice',
    ],
    cautions: [
      'Keep the constriction soft — a quiet whisper, not Darth Vader',
      'Caution with hypertension, pregnancy, or active respiratory infection',
      'Avoid with sore throat',
    ],
  },
});
</script>
</body>
</html>
