<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Breathing</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Box Breathing',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', fn: s=>s, audio: 'nasal-in',  scale: 'inhale', via: 'nose' },
    { label: 'Hold',   fn: s=>s, audio: 'silent',    scale: 'hold' },
    { label: 'Exhale', fn: s=>s, audio: 'nasal-out', scale: 'exhale', via: 'nose' },
    { label: 'Hold',   fn: s=>s, audio: 'silent',    scale: 'hold' },
  ],
  controls: { lengths: [4, 6, 8], defaultLength: 4 },
  about: {
    description: 'Four equal phases — inhale, hold, exhale, hold — each the same duration. Popularised by Navy SEALs for stress control and focus. One cycle takes 16 seconds at the standard 4-second pace.',
    benefits: [
      'Activates the parasympathetic nervous system',
      'Lowers heart rate and cortisol levels',
      'Sharpens focus without causing drowsiness',
      'Portable: works in any situation in under a minute',
    ],
    cautions: [
      'If holds feel tight or cause lightheadedness, shorten to 3 s or remove the empty hold',
      'Do not force back-pressure during the holds',
      'Safe for most people; one of the lowest-risk techniques in this app',
    ],
  },
});
</script>
</body>
</html>
