<!DOCTYPE html>
<html lang="en">
<head>

<title>Sitali</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Sitali',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', duration: 4, audio: 'mouth-in',  scale: 'inhale', via: 'tongue' },
    { label: 'Exhale', duration: 5, audio: 'nasal-out', scale: 'exhale', via: 'nose'   },
  ],
  controls: {},
  about: {
    description: 'Cooling Breath — inhale through a curled tongue (or through the teeth with lips parted — Sitkari — for those who cannot curl their tongue), then exhale through the nose. The air is cooled and moistened as it passes across the tongue.',
    benefits: [
      'Cools body temperature — effective in hot weather or hot flashes',
      'Soothes pitta imbalance (irritation, anger, inflammation)',
      'Lowers blood pressure',
      'Calms hunger and thirst',
      'Supports sleep when overheated',
    ],
    cautions: [
      'Avoid in cold weather, polluted air, or if asthmatic',
      'Skip with chronic bronchitis, cough/cold, or low blood pressure',
      'Cool air bypasses nasal warming — use caution in winter',
    ],
  },
});
</script>
