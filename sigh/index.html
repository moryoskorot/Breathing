<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physiological Sigh</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Physiological Sigh',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', duration: 3, audio: 'nasal-in',       scale: 'inhale', via: 'nose'       },
    { label: 'Top-up', duration: 1, audio: 'nasal-in-sharp',  scale: 'inhale', via: 'nose-sharp' },
    { label: 'Exhale', duration: 8, audio: 'mouth-out',       scale: 'exhale', via: 'mouth'      },
  ],
  controls: {},
  about: {
    description: 'A double nasal inhale (full breath, then a short sharp top-up) followed by a long, slow mouth exhale. Mimics the body\'s spontaneous sigh reflex. Popularised by Stanford neuroscientist Andrew Huberman. Balban et al. (Cell Reports Medicine 2023) found 5 minutes daily produced greater mood improvement than mindfulness meditation.',
    benefits: [
      'Fastest known voluntary technique to reduce acute stress',
      'Reinflates collapsed alveoli and offloads CO₂',
      'Larger daily positive affect gains than mindfulness (Balban 2023)',
      'Works in 1–3 breaths for an immediate reset',
    ],
    cautions: [
      'Very safe; mild lightheadedness possible if exhales become forceful',
      'Avoid forcing the second inhale if you are congested',
    ],
  },
});
</script>
</body>
</html>
