<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wim Hof Method</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
const $orb = document.querySelector('.breath-orb') || { classList: { add(){}, remove(){} } };

const powerRound = {
  phases: [
    { label: 'Inhale', duration: 1.5, audio: 'power', scale: 'inhale', via: 'mouth' },
    { label: 'Exhale', duration: 0.5, audio: 'power', scale: 'exhale', via: 'mouth' },
  ],
  count: 30,
  endPhases: [
    { label: 'Holding in', duration: 120, audio: 'silent', scale: 'hold', openEnded: true, hint: 'tap to exhale' },
    { label: 'Recovery',   duration: 15,  audio: 'nasal-in', scale: 'inhale', via: 'nose' },
  ],
  restPhase: { label: 'Rest', duration: 15, audio: 'silent', scale: 'hold' },
};

BreathingEngine.init({
  title: 'Wim Hof',
  mode: 'count-based',
  rounds: [ powerRound, powerRound, powerRound ],
  controls: {},
  safety: {
    key: 'wimhof',
    title: 'Wim Hof Method — Safety Notice',
    body: 'This technique involves controlled hyperventilation which can cause dizziness or fainting. Always practice seated or lying down. Never practice near water, while driving, or standing. Stop immediately if you feel unwell.\n\nContraindicated in: pregnancy, epilepsy, cardiovascular disease, severe hypertension, and panic disorder.',
    icons: ['pregnant', 'cardiac'],
  },
  about: {
    description: '3 rounds of 30 power breaths (deep inhale, relaxed exhale), followed by an empty-lung retention held as long as comfortable, then a 15-second recovery hold. Always seated or lying down.',
    benefits: [
      'Documented immune modulation: TNF-α 53% lower, IL-10 194% higher (Kox et al., PNAS 2014)',
      'Adrenaline surge and transient respiratory alkalosis',
      'Improved cold tolerance and perceived energy',
      'Sharpens focus and mood post-session',
    ],
    cautions: [
      'Never near water, while driving, or standing — syncope risk',
      'Contraindicated in pregnancy, epilepsy, cardiovascular disease, hypertension, panic disorder',
      'Tingling and lightheadedness during power breaths is expected but should resolve',
      'Practice on an empty stomach, morning preferred',
    ],
  },
  onPhaseStart(phase) {
    const orb = document.getElementById('breathOrb');
    if (!orb) return;
    if (phase.openEnded) orb.classList.add('open-ended');
    else orb.classList.remove('open-ended');
  },
  onStop() {
    const orb = document.getElementById('breathOrb');
    if (orb) orb.classList.remove('open-ended');
  },
});
</script>
</body>
</html>
