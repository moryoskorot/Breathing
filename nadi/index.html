<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadi Shodhana</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Nadi Shodhana',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', fn: s=>s,     audio: 'nasal-in-muted',  scale: 'inhale', nostril: 'left',  close: 'right' },
    { label: 'Hold',   fn: s=>s*1.5, audio: 'silent',          scale: 'hold',   nostril: null,    close: 'both'  },
    { label: 'Exhale', fn: s=>s*2,   audio: 'nasal-out-muted', scale: 'exhale', nostril: 'right', close: 'left'  },
    { label: 'Inhale', fn: s=>s,     audio: 'nasal-in-muted',  scale: 'inhale', nostril: 'right', close: 'left'  },
    { label: 'Hold',   fn: s=>s*1.5, audio: 'silent',          scale: 'hold',   nostril: null,    close: 'both'  },
    { label: 'Exhale', fn: s=>s*2,   audio: 'nasal-out-muted', scale: 'exhale', nostril: 'left',  close: 'right' },
  ],
  controls: { lengths: [4, 6, 8], defaultLength: 4 },
  indicator: 'nadi',
  safety: { icons: ['pregnant'] },
  about: {
    description: 'Alternate-nostril breathing from Hatha Yoga. Inhale through one nostril while blocking the other, then switch — balancing the nervous system and calming the mind.',
    benefits: [
      'Balances left and right brain hemispheres',
      'Reduces anxiety and stress rapidly',
      'Lowers heart rate and blood pressure',
      'Improves focus and mental clarity',
      'Traditionally purifies the energy channels (nadis)',
    ],
    cautions: [
      'Avoid if congested — breathe gently through any partial blockage',
      'Keep the breath smooth; never force',
      'Consult a doctor if you have severe cardiovascular or respiratory conditions',
    ],
  },
});
</script>
</body>
</html>
