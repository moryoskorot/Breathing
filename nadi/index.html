<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadi Shodhana</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<style>
/* nadi-specific: nostril orbs */
.nostril {
  display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100px;
}
.nostril-orb {
  width: 72px; height: 72px; border-radius: 50%;
  border: 2px solid var(--n-idle-border); background: var(--n-idle-bg);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.5s ease; font-size: 26px;
}
.nostril-name {
  font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--n-idle-name); transition: color 0.5s;
}
.nostril-status {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  min-height: 14px; color: transparent; transition: color 0.5s;
}
.nostril.is-active .nostril-orb {
  border-color: var(--n-act-border); background: var(--n-act-bg);
  box-shadow: 0 0 22px var(--n-act-shadow), inset 0 0 10px var(--n-act-bg);
}
.nostril.is-active .nostril-name   { color: var(--n-act-name); }
.nostril.is-active .nostril-status { color: var(--n-act-status); }
.nostril.is-closed .nostril-orb { border-color: var(--n-clo-border); background: var(--n-clo-bg); }
.nostril.is-closed .nostril-name   { color: var(--n-clo-name); }
.nostril.is-closed .nostril-status { color: var(--n-clo-status); }
.nostril.is-hold .nostril-orb {
  border-color: var(--n-hld-border); background: var(--n-hld-bg);
  box-shadow: 0 0 16px var(--n-hld-shadow);
}
.nostril.is-hold .nostril-name   { color: var(--n-hld-name); }
.nostril.is-hold .nostril-status { color: var(--n-hld-status); }
.finger-guide {
  position: absolute; bottom: -36px;
  font-size: 11px; color: var(--text-ghost); letter-spacing: 0.04em; white-space: nowrap;
}
</style>
</head>
<body class="exercise-page theme-dark">

<div class="sky-layer">
  <svg viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d8fe8"/><stop offset="100%" stop-color="#7fb5fa"/>
    </linearGradient></defs>
    <path fill="url(#skyGrad)" d="M0,0 L1440,0 L1440,260 C1360,235 1280,272 1160,248 C1040,224 940,268 800,245 C660,222 560,262 400,238 C280,220 160,255 0,235 Z"/>
  </svg>
</div>

<div class="header">
  <a class="back-btn" href="../" title="Back">←</a>
  <div class="title">Nadi Shodhana</div>
  <button class="about-btn" id="aboutBtn" title="About">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
  </button>
</div>

<div class="stage" id="stage">
  <div class="nostril" id="nostrilLeft">
    <div class="nostril-orb">🌬</div>
    <div class="nostril-name">Left</div>
    <div class="nostril-status" id="leftStatus"></div>
  </div>
  <div class="breath-wrap">
    <svg class="progress-svg" viewBox="0 0 220 220" width="220" height="220">
      <circle class="arc-track" cx="110" cy="110" r="105"/>
      <circle class="arc-fill"  cx="110" cy="110" r="105" id="arcFill"/>
    </svg>
    <div class="breath-orb" id="breathOrb">
      <div class="phase-label" id="phaseLabel"></div>
      <div class="phase-countdown" id="phaseCountdown"></div>
      <div class="phase-idle" id="phaseIdle">press play</div>
    </div>
    <div class="finger-guide">thumb → right · ring → left</div>
  </div>
  <div class="nostril" id="nostrilRight">
    <div class="nostril-orb">🌬</div>
    <div class="nostril-name">Right</div>
    <div class="nostril-status" id="rightStatus"></div>
  </div>
</div>

<div class="toolbar">
  <div id="engineControls"></div>
  <button class="play-btn" id="playBtn">▶</button>
  <div class="session-timer" id="sessionTimer">0:00</div>
  <div class="theme-group">
    <button class="theme-btn" data-theme="sand"  title="Sand"  style="background:#FFEBCD; border-color:#c4b48a;"></button>
    <button class="theme-btn" data-theme="light" title="Light" style="background:#ffffff; border-color:#cccccc;"></button>
    <button class="theme-btn" data-theme="dark"  title="Dark"  style="background:#090e1a; border-color:#2a3a5e;"></button>
  </div>
</div>

<div class="footer">
  <label class="vol-row">
    <span class="vol-label">🔈</span>
    <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="0.5">
    <span class="vol-label">🔊</span>
  </label>
  <span>Made by <a href="https://www.linkedin.com/in/mor-yosef-185331196/" target="_blank" rel="noopener">Mor Yosef</a></span>
</div>

<script src="../engine.js"></script>
<script>
const $nL = document.getElementById('nostrilLeft');
const $nR = document.getElementById('nostrilRight');
const $lS = document.getElementById('leftStatus');
const $rS = document.getElementById('rightStatus');

function setNostrilState(side, state, txt) {
  const el = side === 'left' ? $nL : $nR;
  const st = side === 'left' ? $lS : $rS;
  el.className = 'nostril' + (state ? ' is-' + state : '');
  st.textContent = txt;
}

BreathingEngine.init({
  title: 'Nadi Shodhana',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', durationFn: s=>s,     audioType: 'nasal-in-muted',  isHold: false, orbScale: 'inhale', nostril: 'left',  close: 'right' },
    { label: 'Hold',   durationFn: s=>s*1.5, audioType: 'silent',          isHold: true,  orbScale: 'hold',   nostril: null,    close: 'both'  },
    { label: 'Exhale', durationFn: s=>s*2,   audioType: 'nasal-out-muted', isHold: false, orbScale: 'exhale', nostril: 'right', close: 'left'  },
    { label: 'Inhale', durationFn: s=>s,     audioType: 'nasal-in-muted',  isHold: false, orbScale: 'inhale', nostril: 'right', close: 'left'  },
    { label: 'Hold',   durationFn: s=>s*1.5, audioType: 'silent',          isHold: true,  orbScale: 'hold',   nostril: null,    close: 'both'  },
    { label: 'Exhale', durationFn: s=>s*2,   audioType: 'nasal-out-muted', isHold: false, orbScale: 'exhale', nostril: 'left',  close: 'right' },
  ],
  controls: { lengths: [4, 6, 8], defaultLength: 4 },
  indicator: 'nadi',
  onPhaseStart(phase) {
    if (phase.close === 'both') {
      setNostrilState('left',  'hold', 'hold');
      setNostrilState('right', 'hold', 'hold');
    } else {
      const ls = phase.nostril === 'left'  ? 'active' : (phase.close === 'left'  ? 'closed' : '');
      const rs = phase.nostril === 'right' ? 'active' : (phase.close === 'right' ? 'closed' : '');
      setNostrilState('left',  ls, ls === 'active' ? phase.label.toLowerCase() : ls === 'closed' ? 'closed' : '');
      setNostrilState('right', rs, rs === 'active' ? phase.label.toLowerCase() : rs === 'closed' ? 'closed' : '');
    }
  },
  onStop() {
    setNostrilState('left',  '', '');
    setNostrilState('right', '', '');
  },
  about: {
    description: 'Alternate-nostril breathing from Hatha Yoga. Inhale through one nostril while blocking the other, then switch — balancing the nervous system and calming the mind.',
    benefits: [
      'Balances left and right brain hemispheres',
      'Reduces anxiety and stress rapidly',
      'Lowers heart rate and blood pressure',
      'Improves focus and mental clarity',
      'Traditionally purifies the energy channels (nadis)',
    ],
    cautions: [
      'Avoid if congested — breathe gently through any partial blockage',
      'Keep the breath smooth; never force',
      'Consult a doctor if you have severe cardiovascular or respiratory conditions',
    ],
  },
});
</script>
</body>
</html>
