<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhastrika</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
const bhasRound = {
  phases: [
    { label: 'Inhale', duration: 1, audio: 'power', scale: 'inhale', via: 'nose' },
    { label: 'Exhale', duration: 1, audio: 'power', scale: 'exhale', via: 'nose' },
  ],
  count: 10,
  restPhase: { label: 'Rest', duration: 20, audio: 'silent', scale: 'hold' },
};

BreathingEngine.init({
  title: 'Bhastrika',
  mode: 'count-based',
  rounds: [ bhasRound, bhasRound, bhasRound ],
  controls: {},
  safety: {
    key: 'bhastrika',
    title: 'Bhastrika — Safety Notice',
    body: 'Bellows Breath is a vigorous, heating pranayama. Both inhale and exhale are forceful. Contraindicated in: pregnancy, menstruation, hypertension, cardiovascular disease, hernia, vertigo, recent abdominal surgery, glaucoma, retinal detachment, and epilepsy. Requires diaphragmatic-breathing competence. Stop immediately if dizzy.',
    icons: ['pregnant', 'cardiac'],
  },
  about: {
    description: 'Bellows Breath — forceful, equal inhalations and exhalations through the nose, driven by the diaphragm. 3 rounds of 10 breaths with a 20-second rest. Unlike Kapalabhati, both the inhale and exhale are active and equal.',
    benefits: [
      'Increases oxygenation and circulation',
      'Stokes digestive fire (agni) and clears nasal passages',
      'Energising — counters lethargy and afternoon slump',
      'Novaes et al. (Frontiers in Psychiatry 2020) found 4 weeks reduced anxiety and modulated amygdala activity',
    ],
    cautions: [
      'Contraindicated in pregnancy, menstruation, hypertension, cardiovascular disease',
      'Also avoid with hernia, vertigo, recent abdominal surgery, glaucoma, retinal detachment, epilepsy',
      'Requires diaphragmatic-breathing competence — master Diaphragmatic first',
      'Practice on an empty stomach, morning preferred',
    ],
  },
});
</script>
</body>
</html>
