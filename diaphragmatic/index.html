<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diaphragmatic</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="exercise-page theme-dark">
<script src="../engine.js"></script>
<script>
BreathingEngine.init({
  title: 'Diaphragmatic',
  mode: 'fixed-cycle',
  phases: [
    { label: 'Inhale', fn: s=>s,     audio: 'nasal-in',  scale: 'inhale', via: 'nose'  },
    { label: 'Exhale', fn: s=>s*1.5, audio: 'mouth-out', scale: 'exhale', via: 'mouth' },
  ],
  controls: { lengths: [4, 5, 6], defaultLength: 4 },
  about: {
    description: 'The foundational breath retraining technique. Inhale through the nose so the belly rises (diaphragm descending), then exhale through pursed lips. One hand on chest, one on belly — the chest should barely move.',
    benefits: [
      'Strengthens the diaphragm (does ~80% of normal breathing work)',
      'Reduces work of breathing and lowers heart rate',
      'Lowers blood pressure and improves oxygenation',
      'Foundation for asthma and COPD self-management',
      'Activates parasympathetic and vagal tone',
    ],
    cautions: [
      'Essentially no contraindications for healthy adults',
      'COPD patients should consult their pulmonologist before extended practice',
      'Some anxiety-prone users feel paradoxically more anxious focusing on breath — switch anchor if needed',
    ],
  },
});
</script>
</body>
</html>
